<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TPB Builder | Tristan Patterson Builders</title>
<meta name="description" content="TPB Builder: a quick Wellington building-site platform game from Tristan Patterson Builders.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=Big+Shoulders+Display:wght@900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none;
           -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="TPB Builder game. Arrow keys or A and D to move, space to jump, X to swing the hammer."></canvas>
<script>
/* TPB Builder v1.0 — plain canvas, no libraries. All artwork is drawn in code.
   World units: y = 0 is ground level, up is negative. The view is 360 units tall on a
   landscape screen and grows taller (never narrower than 520 wide) on a portrait phone. */
(() => {
'use strict';
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const DISP = '"Big Shoulders Display","Arial Narrow",Impact,sans-serif';
const BODY = 'Archivo,system-ui,-apple-system,"Segoe UI",sans-serif';
const YEL = '#ffd60a', INK = '#0a0a0a';
const TAU = Math.PI * 2;
const QS = new URLSearchParams(location.search);
const DEBUG = { bot: QS.has('bot'), god: QS.has('god') || QS.has('bot'), lvl: parseInt(QS.get('lvl') || '0', 10) };

let VW = 640, VH = 360, SC = 1, DPR = 1, PAD = 56;
const TOUCH = { on: window.matchMedia && matchMedia('(pointer: coarse)').matches };
function resize() {
  const w = Math.max(50, innerWidth), h = Math.max(50, innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  let s = h / 360; if (w / s < 520) s = w / 520;
  SC = s; VW = w / s; VH = h / s;
  PAD = Math.min(Math.max(VH - 400, TOUCH.on ? 100 : 56), Math.max(100, VH * 0.36));
}
addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r); g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath(); }
function txt(s, x, y, size, col, align, font, g) { g = g || ctx; g.font = (font === BODY ? '600 ' : '900 ') + size + 'px ' + (font || DISP); g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(s, x, y); }
function line(g, x1, y1, x2, y2, w, col, cap) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = cap || 'round'; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

const Store = {
  get(k, d) { try { const v = parseInt(localStorage.getItem(k), 10); return isNaN(v) ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
};

/* ---------- sound (generated, no files) ---------- */
const SFX = (() => {
  let ac = null, muted = Store.get('tpb_muted', 0) === 1;
  const C = () => { if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  function tone(f, d, type, vol, to, delay) {
    if (muted) return; try { const c = C(); if (!c) return; const t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
      g.gain.setValueAtTime(vol || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) {}
  }
  function noise(d, vol, hp) {
    if (muted) return; try { const c = C(); if (!c) return; const n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);
      for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = c.createBufferSource(); s.buffer = b; const g = c.createGain(); g.gain.value = vol || 0.08;
      if (hp) { const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; s.connect(f).connect(g); } else s.connect(g); g.connect(c.destination); s.start(); } catch (e) {}
  }
  return {
    get muted() { return muted; }, toggle() { muted = !muted; Store.set('tpb_muted', muted ? 1 : 0); }, wake() { C(); },
    jump() { tone(300, 0.16, 'square', 0.045, 620); }, land() { noise(0.06, 0.05); },
    swing() { noise(0.09, 0.05, 1800); }, hit() { tone(170, 0.09, 'square', 0.08, 70); noise(0.08, 0.09); },
    nail() { tone(1500, 0.05, 'triangle', 0.05, 2100); }, tool() { tone(660, 0.09, 'triangle', 0.08); tone(990, 0.16, 'triangle', 0.08, 0, 0.08); },
    hurt() { tone(260, 0.3, 'sawtooth', 0.08, 70); }, shoot() { noise(0.05, 0.1, 900); tone(900, 0.05, 'square', 0.04, 300); },
    pie() { [392, 494, 587].forEach((f, i) => tone(f, 0.12, 'triangle', 0.08, 0, i * 0.07)); },
    check() { tone(523, 0.1, 'triangle', 0.07); tone(784, 0.2, 'triangle', 0.07, 0, 0.1); },
    gust() { noise(1.1, 0.035, 400); }, click() { tone(520, 0.05, 'square', 0.05); },
    win() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.22, 'triangle', 0.09, 0, i * 0.11)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.24, 'sawtooth', 0.06, 0, i * 0.15)); }
  };
})();

/* ================================================================
   ARTWORK
   ================================================================ */
/* The TPB mark: house outline with a floor, serif letters inside. */
function drawLogo(g, x, y, w, col) {
  const h = w * 0.6, t = Math.max(1.5, w * 0.045);
  g.save(); g.translate(x, y); g.strokeStyle = col; g.lineWidth = t; g.lineJoin = 'miter'; g.lineCap = 'butt';
  g.beginPath(); g.moveTo(t / 2, h - t / 2); g.lineTo(t / 2, h * 0.3); g.lineTo(w / 2, t * 0.8); g.lineTo(w - t / 2, h * 0.3); g.lineTo(w - t / 2, h - t / 2); g.closePath(); g.stroke();
  g.font = '400 ' + (h * 0.5) + 'px Georgia,"Times New Roman",serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText('TPB', w / 2, h * 0.63);
  g.restore();
}

/* --- tools, each drawn in a box of about 30 units centred on 0,0 --- */
const TOOLS = [
  { name: 'Claw hammer', draw(g) {
      g.save(); g.rotate(-0.6);
      g.fillStyle = '#b9793d'; rr(g, -2.4, -6, 4.8, 21, 2); g.fill(); g.fillStyle = '#8a5526'; g.fillRect(-2.4, 2, 4.8, 1);
      g.fillStyle = '#20242b'; rr(g, -2.9, 6, 5.8, 9.5, 2.4); g.fill();
      g.fillStyle = '#aab4bf'; g.beginPath(); g.moveTo(-3.4, -11); g.lineTo(6.5, -11); g.lineTo(6.5, -9.8); g.lineTo(9.5, -9.8); g.lineTo(9.5, -4.2); g.lineTo(6.5, -4.2); g.lineTo(6.5, -5); g.lineTo(-3.4, -5); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(-3.2, -11); g.quadraticCurveTo(-10, -11.5, -12.5, -4.5); g.lineTo(-10.2, -4.2); g.quadraticCurveTo(-8.5, -7.6, -3.2, -6.4); g.closePath(); g.fill();
      g.fillStyle = '#e4eaf0'; g.fillRect(-3, -10.4, 9, 1.2); g.fillStyle = '#6f7a86'; g.fillRect(8.6, -9.8, 0.9, 5.6);
      g.restore(); } },
  { name: 'Tape measure', draw(g) {
      g.fillStyle = '#c9cfd6'; g.fillRect(6, 4.5, 8.5, 3); g.fillStyle = '#20242b'; for (let i = 0; i < 4; i++) g.fillRect(7.5 + i * 1.8, 4.5, 0.6, i % 2 ? 1.2 : 2); g.fillStyle = '#8b949e'; g.fillRect(14, 3.3, 1.4, 5.6);
      g.fillStyle = '#e0b400'; rr(g, -10, -9, 18, 18, 4.5); g.fill(); g.fillStyle = YEL; rr(g, -10, -9.6, 18, 17, 4.5); g.fill();
      g.fillStyle = '#20242b'; g.beginPath(); g.arc(-1, -1, 5.2, 0, TAU); g.fill(); g.fillStyle = '#4a515c'; g.beginPath(); g.arc(-1, -1, 2, 0, TAU); g.fill();
      g.fillStyle = '#20242b'; rr(g, -4, -11.6, 7, 3.2, 1.2); g.fill(); g.fillStyle = '#fff6c4'; g.fillRect(-8, -7.6, 5, 1.3); } },
  { name: 'Spirit level', draw(g) {
      g.save(); g.rotate(-0.28);
      g.fillStyle = '#b3251c'; rr(g, -15, -4, 30, 8.6, 1.4); g.fill(); g.fillStyle = '#e03a2d'; rr(g, -15, -4.4, 30, 7.6, 1.4); g.fill();
      g.fillStyle = '#20242b'; g.fillRect(-15, -4.4, 2.6, 8.4); g.fillRect(12.4, -4.4, 2.6, 8.4);
      g.fillStyle = '#f4f6f8'; rr(g, -4.5, -3, 9, 4.6, 2); g.fill(); g.fillStyle = '#b6e33a'; rr(g, -3.6, -2.2, 7.2, 3, 1.5); g.fill(); g.fillStyle = '#f4ffd0'; g.beginPath(); g.arc(0.4, -0.7, 1.1, 0, TAU); g.fill();
      g.fillStyle = '#20242b'; g.fillRect(-1.6, -2.2, 0.5, 3); g.fillRect(1.2, -2.2, 0.5, 3);
      g.fillStyle = '#f4f6f8'; g.beginPath(); g.arc(-9, -0.6, 2.2, 0, TAU); g.arc(9, -0.6, 2.2, 0, TAU); g.fill(); g.fillStyle = '#b6e33a'; g.beginPath(); g.arc(-9, -0.6, 1.4, 0, TAU); g.arc(9, -0.6, 1.4, 0, TAU); g.fill();
      g.restore(); } },
  { name: 'Handsaw', draw(g) {
      g.save(); g.rotate(0.16);
      g.fillStyle = '#c3ccd5'; g.beginPath(); g.moveTo(-5, -6); g.lineTo(15.5, -1.4); g.lineTo(15.5, 2.2); g.lineTo(-5, 6); g.closePath(); g.fill();
      g.fillStyle = '#eef2f6'; g.beginPath(); g.moveTo(-5, -6); g.lineTo(15.5, -1.4); g.lineTo(15.5, -0.6); g.lineTo(-5, -4.4); g.closePath(); g.fill();
      g.fillStyle = '#7c8792'; g.beginPath(); g.moveTo(-5, 6); for (let i = 0; i <= 10; i++) { const x = -5 + i * 2.05, y = 6 - i * 0.38; g.lineTo(x + 1, y + 1.5); g.lineTo(x + 2.05, y - 0.38); } g.closePath(); g.fill();
      g.fillStyle = '#b9793d'; g.beginPath(); g.moveTo(-14.5, -6); g.quadraticCurveTo(-9, -9.5, -3.6, -7); g.lineTo(-3.6, 7.5); g.quadraticCurveTo(-9, 10.5, -14, 7); g.quadraticCurveTo(-16.5, 0.5, -14.5, -6); g.closePath(); g.fill();
      g.fillStyle = '#5c3718'; rr(g, -12, -3.2, 5.8, 7.4, 2.6); g.fill(); g.fillStyle = '#d7dde3'; g.beginPath(); g.arc(-5.4, -5, 0.9, 0, TAU); g.arc(-5.4, 5.4, 0.9, 0, TAU); g.fill();
      g.restore(); } },
  { name: 'Cordless drill', draw(g) {
      g.fillStyle = '#9aa5b0'; g.fillRect(9, -7.6, 6.5, 1.6); g.fillStyle = '#59626d'; rr(g, 5, -9.6, 5, 5.6, 1); g.fill(); g.fillStyle = '#39414b'; for (let i = 0; i < 3; i++) g.fillRect(5.8 + i * 1.5, -9.6, 0.6, 5.6);
      g.fillStyle = '#1f6f8f'; rr(g, -11, -11.2, 17, 8.8, 2.6); g.fill(); g.fillStyle = '#2b93bd'; rr(g, -11, -11.6, 17, 6, 2.6); g.fill();
      g.fillStyle = '#20242b'; rr(g, -10.6, -10, 3.4, 5.6, 1); g.fill(); g.fillStyle = '#20242b'; g.beginPath(); g.moveTo(-6.5, -3.4); g.lineTo(-0.5, -3.4); g.lineTo(-2.4, 7); g.lineTo(-8.6, 7); g.closePath(); g.fill();
      g.fillStyle = YEL; rr(g, -0.6, -2.6, 2.2, 3.8, 0.8); g.fill(); g.fillStyle = '#1f6f8f'; rr(g, -11.5, 6.4, 12, 5, 1.4); g.fill(); g.fillStyle = '#20242b'; g.fillRect(-11.5, 9.6, 12, 1.8); } },
  { name: 'Speed square', draw(g) {
      g.fillStyle = '#8f9aa6'; g.beginPath(); g.moveTo(-11, -12); g.lineTo(-11, 11); g.lineTo(12, 11); g.closePath(); g.fill();
      g.fillStyle = '#c9d1d9'; g.beginPath(); g.moveTo(-10, -9.6); g.lineTo(-10, 10); g.lineTo(9.6, 10); g.closePath(); g.fill();
      g.fillStyle = '#6d7782'; rr(g, -13, -12.5, 3.6, 24, 1); g.fill();
      g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.moveTo(-6, 0.5); g.lineTo(-6, 6.5); g.lineTo(0, 6.5); g.closePath(); g.fill(); g.globalCompositeOperation = 'source-over';
      g.fillStyle = '#39414b'; for (let i = 0; i < 9; i++) g.fillRect(-8.2 + i * 2.1, 10 - (i % 2 ? 1.6 : 2.6), 0.5, i % 2 ? 1.6 : 2.6); for (let i = 0; i < 7; i++) { g.save(); g.translate(-7.4 + i * 2.35, -6.6 + i * 2.35); g.rotate(Math.PI / 4); g.fillRect(-0.25, -1.2, 0.5, 2.4); g.restore(); } } }
];
/* Tools are cached as sprites (the square uses a cut-out, which needs its own canvas). */
const TOOL_SPR = TOOLS.map(t => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.translate(64, 64); g.scale(3.6, 3.6); t.draw(g); return c; });
function drawTool(g, i, x, y, s, alpha) { g.save(); if (alpha != null) g.globalAlpha = alpha; g.drawImage(TOOL_SPR[i], x - 17.8 * s, y - 17.8 * s, 35.6 * s, 35.6 * s); g.restore(); }

function drawNail(g, x, y, t) {
  g.save(); g.translate(x, y); g.rotate(0.5 + Math.sin(t * 3 + x) * 0.12);
  g.fillStyle = '#eef2f6'; g.fillRect(-0.9, -7, 1.8, 13); g.fillStyle = '#9aa5b0'; g.fillRect(0.2, -7, 0.7, 13);
  g.fillStyle = '#d7dde3'; rr(g, -3.4, -9, 6.8, 2.2, 1); g.fill(); g.fillStyle = '#9aa5b0'; g.beginPath(); g.moveTo(-0.9, 6); g.lineTo(0, 9); g.lineTo(0.9, 6); g.fill();
  g.restore();
  const tw = (Math.sin(t * 5 + x * 0.7) + 1) / 2; if (tw > 0.8) { g.fillStyle = '#fff'; g.fillRect(x + 3, y - 8, 1.2, 4); g.fillRect(x + 1.6, y - 6.6, 4, 1.2); }
}
function drawPie(g, x, y, t) {
  g.save(); g.translate(x, y);
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.2; for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * 5, -9); g.quadraticCurveTo(i * 5 + Math.sin(t * 3 + i) * 3, -13, i * 5, -17); g.stroke(); }
  g.fillStyle = '#c9d1d9'; g.beginPath(); g.moveTo(-12, -2); g.lineTo(12, -2); g.lineTo(9, 7); g.lineTo(-9, 7); g.closePath(); g.fill();
  g.fillStyle = '#c8872f'; g.beginPath(); g.ellipse(0, -2.5, 12.5, 6.4, 0, Math.PI, TAU); g.fill(); g.fillStyle = '#e6aa4a'; g.beginPath(); g.ellipse(0, -3.6, 10.5, 4.6, 0, Math.PI, TAU); g.fill();
  g.fillStyle = '#8a5a1c'; g.fillRect(-3, -7, 1.4, 2.4); g.fillRect(1.6, -7, 1.4, 2.4);
  g.restore();
}
function drawNailgun(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s || 1, s || 1);
  g.fillStyle = '#20242b'; g.beginPath(); g.moveTo(-8, -2); g.lineTo(-3, -2); g.lineTo(-5.5, 11); g.lineTo(-10.5, 11); g.closePath(); g.fill();
  g.fillStyle = '#8f9aa6'; g.beginPath(); g.moveTo(2, 0); g.lineTo(8, 0); g.lineTo(2, 13); g.lineTo(-4, 13); g.closePath(); g.fill(); g.fillStyle = '#6d7782'; g.fillRect(-4, 11.5, 6.6, 1.6);
  g.fillStyle = '#e0651b'; rr(g, -12, -11, 21, 10, 3); g.fill(); g.fillStyle = '#f58a3c'; rr(g, -12, -11.4, 21, 6, 3); g.fill();
  g.fillStyle = '#20242b'; rr(g, 8, -9, 5.6, 9, 1); g.fill(); g.fillStyle = '#9aa5b0'; g.fillRect(13, -4.4, 3.4, 2.6); g.fillStyle = '#20242b'; rr(g, -13.5, -10, 3, 8, 1); g.fill();
  g.restore();
}

/* --- the builder: vector figure with a simple swinging walk --- */
function drawBuilder(g, p, t) {
  const run = p.onGround && Math.abs(p.vx) > 20, air = !p.onGround;
  const ph = p.phase, sw = run ? Math.sin(ph) : 0, bob = run ? Math.abs(Math.cos(ph)) * 1.6 : (p.onGround ? Math.sin(t * 2.6) * 0.5 : 0);
  g.save(); g.translate(p.x, p.y); g.scale(p.facing * (1 + p.squash * 0.25), 1 - p.squash * 0.25);
  const leg = (hx, a, back) => {
    const kx = hx + Math.sin(a) * 7, ky = -11 + Math.abs(Math.cos(a)) * 0.5, fx = hx + Math.sin(a) * 12, fy = -1.5 - Math.max(0, Math.sin(a + (back ? 0.9 : -0.9))) * 4 * (run ? 1 : 0);
    g.strokeStyle = back ? '#1c2a4a' : '#263a66'; g.lineWidth = 6.4; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(hx, -20 - bob); g.lineTo(kx, ky - bob * 0.5); g.lineTo(fx, fy - 2.4); g.stroke();
    g.fillStyle = back ? '#3d2a18' : '#5a3d22'; rr(g, fx - 3.6, fy - 4.2, 9.4, 4.6, 2); g.fill(); g.fillStyle = '#20242b'; g.fillRect(fx - 3.6, fy - 0.8, 9.4, 1.2);
  };
  const la = air ? 0.75 : sw * 0.8, lb = air ? -0.55 : -sw * 0.8;
  leg(-1.5, lb, true);
  const by = -bob;
  const arm = (sx, sy, a, back, holding) => {
    const ex = sx + Math.sin(a) * 8, ey = sy + Math.cos(a) * 8, a2 = a + (holding ? 0.25 : 0.5), hx = ex + Math.sin(a2) * 7.5, hy = ey + Math.cos(a2) * 7.5;
    g.strokeStyle = back ? '#252c38' : '#323b4a'; g.lineWidth = 5; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke();
    g.strokeStyle = back ? '#c98f62' : '#e2a878'; g.lineWidth = 4.2; g.beginPath(); g.moveTo(ex, ey); g.lineTo(hx, hy); g.stroke();
    return [hx, hy, a2];
  };
  arm(-3, -36 + by, air ? -2.3 : sw * 0.9, true);
  leg(1.5, la, false);
  // torso: dark shirt, hi-vis vest with reflective tape, tool belt
  g.fillStyle = '#323b4a'; rr(g, -8, -41 + by, 16, 23, 5); g.fill();
  g.fillStyle = '#f2c400'; rr(g, -7.4, -40.4 + by, 13, 20, 4); g.fill(); g.fillStyle = YEL; rr(g, -7.4, -40.4 + by, 13, 14, 4); g.fill();
  g.fillStyle = '#dfe5ea'; g.fillRect(-5.6, -40 + by, 2.2, 19); g.fillRect(1.2, -40 + by, 2.2, 19); g.fillRect(-7.4, -29 + by, 13, 2.2);
  g.fillStyle = '#5a3d22'; rr(g, -8.4, -22.4 + by, 16.8, 4.4, 1.6); g.fill(); g.fillStyle = '#7a5530'; rr(g, -8.6, -21 + by, 6, 8, 1.6); g.fill(); g.fillStyle = '#d7b13a'; g.fillRect(-1, -21.6 + by, 2.6, 2.8);
  // head and hard hat
  g.fillStyle = '#e2a878'; g.beginPath(); g.arc(1, -47.5 + by, 7, 0, TAU); g.fill(); g.fillStyle = '#e2a878'; g.fillRect(-2, -42.5 + by, 5, 3);

    const top = Math.max(26, cy - 150);
    drawLogo(ctx, cx - 45, top, 90, '#fff');
    const big = Math.min(92, VW * 0.15); txt('TPB BUILDER', cx, top + 62 + big * 0.5, big, '#fff', 'center'); ctx.fillStyle = YEL; ctx.fillRect(cx - big * 2.2, top + 66 + big, big * 4.4, 5);
    txt('Three jobs. One builder. Mind the southerly.', cx, top + 90 + big, 14, '#fff', 'center', BODY);
    UI.start = button('START JOB', cx, top + 136 + big, 210, 50, true);
    txt(TOUCH.on ? 'Tap to start  ·  thumbs on the on-screen buttons' : 'Move: arrows or A D   Jump: space   Hammer: X or click   Pause: P', cx, top + 182 + big, 11.5, '#d6d6d6', 'center', BODY);
    if (G.best) txt('BEST SCORE  ' + G.best, cx, top + 204 + big, 15, YEL, 'center');
    const tw = Math.min(VW - 30, 300), ty = top + 236 + big; if (ty + 20 < VH) { for (let i = 0; i < 6; i++) drawTool(ctx, i, cx - tw / 2 + tw * (i + 0.5) / 6, ty + Math.sin(G.t * 2 + i) * 3, 1.1); }
  } else if (G.state === 'intro') {
    const k = clamp(G.stateT * 4, 0, 1) * clamp((1.9 - G.stateT) * 4, 0, 1); ctx.globalAlpha = k; panel(0, cy - 62, VW, 124, 0.82);
    txt('JOB ' + (G.job + 1) + ' OF ' + JOBS.length + '  ·  ' + L.place.toUpperCase(), cx, cy - 34, 14, YEL, 'center'); txt(L.name, cx, cy + 2, 54, '#fff', 'center'); txt(L.tip, cx, cy + 42, 13, '#e6e6e6', 'center', BODY); ctx.globalAlpha = 1;
  } else if (G.state === 'paused') {
    ctx.fillStyle = 'rgba(10,10,10,.6)'; ctx.fillRect(0, 0, VW, VH); txt('SMOKO', cx, cy - 34, 64, '#fff', 'center'); txt('Game paused', cx, cy + 8, 13, '#e6e6e6', 'center', BODY);
    UI.resume = button('BACK TO WORK', cx, cy + 52, 210, 44); UI.quit = { x: cx - 80, y: cy + 84, w: 160, h: 30 }; txt('Quit to title', cx, cy + 100, 13, '#fff', 'center', BODY);
  } else if (G.state === 'dead') {
    ctx.fillStyle = 'rgba(10,10,10,.68)'; ctx.fillRect(0, 0, VW, VH); txt('DOWN TOOLS', cx, cy - 40, 64, '#fff', 'center'); txt('Out of hard hats. Have another crack at ' + L.name.toLowerCase() + '.', cx, cy + 4, 13, '#e6e6e6', 'center', BODY);
    if (G.stateT > 0.5) UI.retry = button('TRY AGAIN', cx, cy + 52, 200, 46, true);
  } else if (G.state === 'clear' || G.state === 'win') {
    const win = G.state === 'win', T = G.tally, pw = Math.min(VW - 24, 400), ph = win ? 292 : 232, px = cx - pw / 2, py = Math.max(50, cy - ph / 2 + 10);
    ctx.fillStyle = 'rgba(10,10,10,.5)'; ctx.fillRect(0, 0, VW, VH); panel(px, py, pw, ph, 0.9);
    txt(win ? 'KEYS HANDED OVER' : 'JOB SIGNED OFF', cx, py + 36, Math.min(40, pw * 0.105), YEL, 'center');
    const rows = [['Nails', T.nails + ' × 10'], ['Tools found', T.tools + ' of 6'], ['Time ' + fmtTime(T.time), '+' + T.bonus], ['Hard hats left', '+' + T.hats]];
    rows.forEach((r, i) => { const y = py + 72 + i * 24; if (G.stateT > 0.25 + i * 0.18) { txt(r[0], px + 26, y, 14, '#e6e6e6', 'left', BODY); txt(r[1], px + pw - 26, y, 17, '#fff', 'right'); } ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(px + 26, y + 12, pw - 52, 1); });
    txt('SCORE', px + 26, py + 180, 16, YEL); txt(String(G.score), px + pw - 26, py + 180, 30, '#fff', 'right');
    if (!win) { if (G.stateT > 1) UI.next = button('NEXT JOB', cx, py + ph + 34, 200, 46, true); }
    else { txt(G.score >= G.best ? 'New best score!' : 'Best: ' + G.best, cx, py + 206, 13, '#e6e6e6', 'center', BODY); txt('Got a real job that needs doing?', cx, py + 232, 13, '#fff', 'center', BODY);
      if (G.stateT > 1) { UI.quote = button('GET A QUOTE', cx - pw / 4 + 2, py + 262, pw / 2 - 20, 38); const b = { x: cx + 8, y: py + 243, w: pw / 2 - 20, h: 38 }; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(b.x, b.y, b.w, b.h); txt('PLAY AGAIN', b.x + b.w / 2, b.y + b.h / 2 + 1, 19, '#fff', 'center'); UI.again = b; } }
  }
}

function render() {
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0); ctx.imageSmoothingEnabled = true;
  drawWorld();
  if (G.state !== 'title') { drawHUD(); if (G.state === 'play' || G.state === 'intro') drawTouch(); }
  drawOverlay();
}

/* ================================================================
   INPUT
   ================================================================ */
function confirm_() {
  SFX.wake();
  if (G.state === 'title') { SFX.click(); newRun(); }
  else if (G.state === 'clear' && G.stateT > 1) { SFX.click(); startJob(G.job + 1, true); }
  else if (G.state === 'dead' && G.stateT > 0.5) { SFX.click(); startJob(G.job, false); }
  else if (G.state === 'win' && G.stateT > 1) { SFX.click(); setState('title'); G.L = loadJob(0); }
  else if (G.state === 'paused') setState('play');
}
function togglePause() { if (G.state === 'play') setState('paused'); else if (G.state === 'paused') setState('play'); }
function fullscreen() { try { const d = document; if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else { const e = d.documentElement; const p = (e.requestFullscreen || e.webkitRequestFullscreen).call(e); if (p && p.catch) p.catch(() => {}); } } catch (e) {} }
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'jump', w: 'jump', W: 'jump', ' ': 'jump', x: 'act', X: 'act', j: 'act', J: 'act' };
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return; const k = KEYMAP[e.key];
  if (k) { e.preventDefault(); if (!K[k]) { if (k === 'jump') K.jumpHit = true; if (k === 'act') K.actHit = true; } K[k] = true; if (G.state !== 'play' && G.state !== 'intro' && !e.repeat && (e.key === ' ')) confirm_(); return; }
  if (e.repeat) return;
  if (e.key === 'Enter') { e.preventDefault(); confirm_(); } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause(); else if (e.key === 'm' || e.key === 'M') SFX.toggle(); else if (e.key === 'f' || e.key === 'F') fullscreen();
  else if ((e.key === 'r' || e.key === 'R') && (G.state === 'play' || G.state === 'paused' || G.state === 'dead')) startJob(G.job, false);
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) K[k] = false; });
addEventListener('blur', () => { K.left = K.right = K.jump = K.act = false; if (G.state === 'play' && !DEBUG.bot) setState('paused'); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') setState('paused'); });

const pointers = new Map();
const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / SC, y: (e.clientY - r.top) / SC }; };
const inRect = (p, b) => b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
function whichButton(p) { const B = buttons(), R = B.r * 1.5; let best = null, bd = R; for (const id of ['left', 'right', 'jump', 'act']) { const d = Math.hypot(p.x - B[id].x, p.y - B[id].y); if (d < bd) { bd = d; best = id; } } return best; }
function syncTouch() { const held = { left: false, right: false, jump: false, act: false }; pointers.forEach(v => { if (v) held[v] = true; }); for (const k in held) { if (held[k] && !K[k]) { if (k === 'jump') K.jumpHit = true; if (k === 'act') K.actHit = true; } K[k] = held[k]; } }
cv.addEventListener('pointerdown', e => {
  SFX.wake(); cv.focus({ preventScroll: true }); const p = pos(e), touch = e.pointerType !== 'mouse';
  if (touch && !TOUCH.on) { TOUCH.on = true; resize(); }
  if (G.state === 'title') return;                       // title starts on click, so the page can still scroll past it
  e.preventDefault();
  for (const b of HUDB()) if (Math.abs(p.x - b.x) < 17 && Math.abs(p.y - b.y) < 19) { SFX.click(); if (b.id === 'pause') togglePause(); else if (b.id === 'mute') SFX.toggle(); else fullscreen(); return; }
  if (G.state === 'play' || G.state === 'intro') { if (touch) { pointers.set(e.pointerId, whichButton(p)); syncTouch(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} } else if (e.button === 0) K.actHit = true; return; }
  if (G.state === 'paused') { if (inRect(p, UI.quit)) { SFX.click(); setState('title'); G.L = loadJob(0); } else confirm_(); return; }
  if (G.state === 'win') { if (inRect(p, UI.quote)) { try { window.open('/#contact', '_top'); } catch (err) { location.href = '/#contact'; } } else if (inRect(p, UI.again)) confirm_(); return; }
  confirm_();
});
cv.addEventListener('pointermove', e => { if (pointers.has(e.pointerId)) { const b = whichButton(pos(e)), was = pointers.get(e.pointerId); if ((was === 'left' || was === 'right' || was == null) && b !== 'jump' && b !== 'act') { pointers.set(e.pointerId, b); syncTouch(); } } });
const release = e => { if (pointers.delete(e.pointerId)) syncTouch(); };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
cv.addEventListener('click', () => { if (G.state === 'title') confirm_(); });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- main loop ---------- */
let last = 0;
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now;
  const steps = DEBUG.bot ? 6 : 1; for (let i = 0; i < steps; i++) update(DEBUG.bot ? 0.016 : dt);
  if (DEBUG.bot && (G.state === 'clear' || G.state === 'intro') ) { G.stateT += 1; if (G.state === 'clear') confirm_(); }
  render(); requestAnimationFrame(frame);
}
setState('title'); cv.style.touchAction = 'pan-y';
window.__tpb = { G, P, K, JOBS, startJob, newRun };
if (document.fonts && document.fonts.load) { document.fonts.load('900 20px "Big Shoulders Display"').catch(() => {}); }
if (DEBUG.lvl || DEBUG.bot) newRun();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
