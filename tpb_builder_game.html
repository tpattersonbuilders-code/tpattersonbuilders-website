<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>TPB Builder — v0.3</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #1a1d24; color: #eaeaea;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  header { text-align: center; padding: 14px 10px 4px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
  .controls-hint {
    text-align: center; padding: 4px 10px 10px;
    font-size: 13px; color: #9aa3b2;
  }
  .controls-hint kbd {
    background: #2a2f3a; border: 1px solid #3a4150;
    border-radius: 3px; padding: 2px 6px;
    font-family: inherit; font-size: 12px;
  }
  .game-wrap {
    position: relative;
    display: inline-block;
    margin: 0 auto;
    width: 100%;
    max-width: 1060px;  /* matches new canvas width + border */
  }
  #game {
    display: block; margin: 0 auto;
    border: 2px solid #333;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    max-width: 100%;
  }
  /* Touch control overlay — only visible on small screens */
  #touch {
    position: absolute;
    left: 0; right: 0; bottom: 10px;
    display: none;
    justify-content: space-between;
    pointer-events: none;
    padding: 0 14px;
  }
  #touch .grp { display: flex; gap: 12px; pointer-events: auto; }
  #touch button {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(30,35,45,0.75);
    border: 2px solid rgba(240,240,240,0.25);
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #touch button:active { background: rgba(80,120,200,0.85); }
  @media (pointer: coarse), (max-width: 1100px) {
    #touch { display: flex; }
    .controls-hint { display: none; }
  }
  footer { text-align: center; color: #6b7383; font-size: 12px; padding: 12px; }
  .wrap { text-align: center; }
</style>
</head>
<body>

<header><h1>TPB Builder</h1></header>
<div class="controls-hint">
  <kbd>&larr;</kbd> / <kbd>&rarr;</kbd> or <kbd>A</kbd>/<kbd>D</kbd> — move
  &middot; <kbd>Space</kbd> or <kbd>&uarr;</kbd> — jump
  &middot; <kbd>X</kbd> — hammer &middot; <kbd>R</kbd> — restart
</div>

<div class="wrap">
  <div class="game-wrap">
    <div id="game"></div>
    <div id="touch" aria-hidden="true">
      <div class="grp">
        <button id="btn-left" aria-label="Left">&larr;</button>
        <button id="btn-right" aria-label="Right">&rarr;</button>
      </div>
      <div class="grp">
        <button id="btn-hammer" aria-label="Hammer">X</button>
        <button id="btn-jump" aria-label="Jump">&uarr;</button>
      </div>
    </div>
  </div>
</div>

<footer>v0.3 &middot; now with sound, title screen, rats, level 2, and touch</footer>

/* =========================================================
 *  GLOBAL CONSTANTS
 * ========================================================= */
const GAME_W = 1040;   // widened 30% from 800
const GAME_H = 400;
const PLAYER_SCALE = 3;
const GROUND_Y = GAME_H - 40;
const MOVE_SPEED = 220;
const JUMP_VELOCITY = -540;
const GRAVITY = 1400;

const HARD_HAT_POINTS = 10;
const BARREL_POINTS   = 25;
const RAT_POINTS      = 50;

/* =========================================================
 *  PERSISTENT STORAGE (best score + best time)
 * ========================================================= */
const Storage = {
  key_score: 'tpb_best_score',
  key_time:  'tpb_best_time_ms',
  getBestScore() {
    try { const v = parseInt(localStorage.getItem(this.key_score)); return isNaN(v) ? 0 : v; }
    catch (e) { return 0; }
  },
  setBestScore(v) {
    try { localStorage.setItem(this.key_score, String(v)); } catch (e) {}
  },
  getBestTimeMs() {
    try { const v = parseInt(localStorage.getItem(this.key_time)); return isNaN(v) ? null : v; }
    catch (e) { return null; }
  },
  setBestTimeMs(v) {
    try { localStorage.setItem(this.key_time, String(v)); } catch (e) {}
  },
};

function formatTime(ms) {
  if (ms == null || !isFinite(ms)) return '--:--';
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

/* =========================================================
 *  SOUND FX — procedurally generated via WebAudio
 * ========================================================= */
const SFX = (() => {
  let ctx;
  const getCtx = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());

  function tone(freq, dur, type='square', vol=0.08, slideTo=null) {
    try {
      const c = getCtx();
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, c.currentTime);
      if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, c.currentTime + dur);
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g).connect(c.destination);
      o.start();
      o.stop(c.currentTime + dur);
    } catch (e) { /* sound is optional */ }
  }
  function noise(dur, vol=0.08) {
    try {
      const c = getCtx();
      const buffer = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      const src = c.createBufferSource();
      src.buffer = buffer;
      const g = c.createGain();
      g.gain.value = vol;
      src.connect(g).connect(c.destination);
      src.start();
    } catch (e) {}
  }

  return {
    jump()    { tone(380, 0.12, 'square', 0.08, 660); },
    land()    { tone(180, 0.06, 'square', 0.05); },
    collect() { tone(880, 0.05, 'square', 0.08); setTimeout(()=>tone(1320, 0.08, 'square', 0.08), 40); },
    smash()   { noise(0.2, 0.15); tone(120, 0.15, 'sawtooth', 0.08, 60); },
    hurt()    { tone(220, 0.15, 'sawtooth', 0.09, 110); },
    win()     { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.1), i * 110)); },
    hammer()  { tone(500, 0.06, 'square', 0.05); },
    click()   { tone(880, 0.04, 'square', 0.06); },
  };
})();

/* =========================================================
 *  TOUCH CONTROLS — bridged into Phaser scenes via flags
 * ========================================================= */
const TouchState = { left: false, right: false, jump: false, hammer: false };

function wireTouchControls() {
  const bind = (id, flag) => {
    const el = document.getElementById(id);
    if (!el) return;
    const on  = (e) => { e.preventDefault(); TouchState[flag] = true; };
    const off = (e) => { e.preventDefault(); TouchState[flag] = false; };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend',   off, { passive: false });
    el.addEventListener('touchcancel', off, { passive: false });
    // also support mouse for testing on desktop
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup',   off);
    el.addEventListener('mouseleave', off);
  };
  bind('btn-left',   'left');
  bind('btn-right',  'right');
  bind('btn-jump',   'jump');
  bind('btn-hammer', 'hammer');
}

/* =========================================================
 *  TITLE SCENE
 * ========================================================= */
class TitleScene extends Phaser.Scene {
  constructor() { super('title'); }

  preload() {
    this.load.spritesheet('builder', SPRITE_DATA, { frameWidth: 32, frameHeight: 32 });
    this.load.image('skyline', SKYLINE_DATA);
  }

  create() {
    // Reset state on every entry (class instance persists across scene.start calls)
    this.starting = false;
    // Remove any leftover keyboard handlers from a previous visit
    this.input.keyboard.removeAllListeners();

    // Background
    this.add.rectangle(0, 0, GAME_W, GAME_H, 0x9fd4f0).setOrigin(0);
    this.add.rectangle(0, GAME_H * 0.55, GAME_W, GAME_H * 0.45, 0xc4e6f5).setOrigin(0);

    // Skyline still
    this.add.tileSprite(0, GROUND_Y - 200, GAME_W, 200, 'skyline').setOrigin(0, 0);
    // Ground strip
    this.add.rectangle(0, GROUND_Y, GAME_W, 40, 0xbab2a8).setOrigin(0);
    this.add.rectangle(0, GROUND_Y + 16, GAME_W, 2, 0x8a8278).setOrigin(0);

    // Title only needs the idle animation; levels register the rest with correct looping.
    if (!this.anims.exists('idle')) {
      this.anims.create({
        key: 'idle',
        frames: this.anims.generateFrameNumbers('builder', { frames: [0, 1] }),
        frameRate: 3,
        repeat: -1,
      });
    }

    // Animated builder on the right (idle only)
    const hero = this.add.sprite(GAME_W - 160, GROUND_Y - 50, 'builder').setScale(3);
    hero.play('idle');

    // Title — fits the longer name at a slightly smaller size
    this.add.text(GAME_W/2, 30, 'T PATTERSON BUILDERS', {
      fontFamily: 'monospace', fontSize: '38px', color: '#2a3142',
      stroke: '#ffe27a', strokeThickness: 4,
    }).setOrigin(0.5);

    this.add.text(GAME_W/2, 70, 'a Tristan Patterson Builders production', {
      fontFamily: 'monospace', fontSize: '14px', color: '#2a3142',
    }).setOrigin(0.5);

    // Best score + best time (persistent)
    const bestScore = Storage.getBestScore();
    const bestTime  = Storage.getBestTimeMs();
    const bestLine = `BEST SCORE  ${bestScore.toString().padStart(5,' ')}      BEST TIME  ${formatTime(bestTime)}`;
    this.add.text(GAME_W/2, 95, bestLine, {
      fontFamily: 'monospace', fontSize: '13px', color: '#2a3142',
    }).setOrigin(0.5);

    // Start button
    const btn = this.add.rectangle(GAME_W/2, 140, 240, 56, 0x2a3142).setOrigin(0.5).setStrokeStyle(3, 0xffe27a);
    const btnText = this.add.text(GAME_W/2, 140, 'START JOB', {
      fontFamily: 'monospace', fontSize: '22px', color: '#ffe27a',
    }).setOrigin(0.5);

    btn.setInteractive({ useHandCursor: true });
    btn.on('pointerover', () => btn.setFillStyle(0x3a4254));
    btn.on('pointerout',  () => btn.setFillStyle(0x2a3142));
    btn.on('pointerdown', () => { SFX.click(); this.startGame(); });

    // Controls list — light color with dark stroke so it reads over the skyline
    this.add.text(GAME_W/2, 195,
      'ARROW KEYS / A D    -    MOVE\n' +
      'SPACE / UP          -    JUMP\n' +
      'X or LEFT-CLICK     -    HAMMER\n' +
      'R                   -    RESTART',
      { fontFamily: 'monospace', fontSize: '13px', color: '#ffffff',
        stroke: '#2a3142', strokeThickness: 3, align: 'center', lineSpacing: 4 }
    ).setOrigin(0.5, 0);

    // Keyboard shortcuts
    this.input.keyboard.on('keydown-SPACE', () => this.startGame());
    this.input.keyboard.on('keydown-ENTER', () => this.startGame());

    // Make clicking anywhere also start (helpful on mobile)
    this.input.on('pointerdown', () => { if (!this.starting) this.startGame(); });
  }

  startGame() {
    if (this.starting) return;
    this.starting = true;
    SFX.click();
    // Begin a fresh run: reset score + start timer
    this.registry.set('score', 0);
    this.registry.set('hatCount', 0);
    this.registry.set('barrelCount', 0);
    this.registry.set('ratCount', 0);
    this.registry.set('runStartMs', Date.now());
    this.scene.start('level1');
  }
}

/* =========================================================
 *  BASE LEVEL — shared gameplay code
 * ========================================================= */
class BaseLevel extends Phaser.Scene {
  constructor(key) { super(key); }

  // Subclasses define these:
  //   worldWidth, pits, collectibles, barrels, rats, goalX,
  //   skyTop, skyBottom, groundColor, groundDirtColor, sidewalkColor
  //   nextLevel

  preload() {
    this.load.spritesheet('builder', SPRITE_DATA, { frameWidth: 32, frameHeight: 32 });
    this.load.image('skyline', SKYLINE_DATA);
  }

  create() {
    const W = this.worldWidth;
    this.goalReached = false;

    // ----- Sky -----
    this.add.rectangle(0, 0, W, GAME_H, this.skyTop).setOrigin(0).setDepth(-100);
    this.add.rectangle(0, GAME_H * 0.55, W, GAME_H * 0.45, this.skyBottom).setOrigin(0).setDepth(-99);

    // ----- Skyline -----
    const skyH = 200;
    this.skyline = this.add.tileSprite(0, GROUND_Y - skyH, GAME_W, skyH, 'skyline')
      .setOrigin(0, 0).setScrollFactor(0).setDepth(-50);

    // ----- Road + grass visuals + physics -----
    const segs = this.computeGroundSegments();
    // Layout (from top of ground down):
    //   y = GROUND_Y          → top of asphalt (where player stands)
    //   y = GROUND_Y + 28     → bottom of asphalt, top of grass
    //   y = GAME_H            → bottom of screen
    const ASPHALT_H = 28;
    const ROAD_COLOR   = this.roadColor   || 0x3a3d44;   // dark-grey asphalt
    const ROAD_EDGE    = this.roadEdge    || 0x5a5d64;   // lighter edge lip
    const ROAD_LINE    = this.roadLine    || 0xf0f0e8;   // white center line
    const GRASS_COLOR  = this.grassColor  || 0x4a7b35;   // main grass
    const GRASS_DARK   = this.grassDark   || 0x3a6226;   // grass shadow
    const GRASS_LIGHT  = this.grassLight  || 0x5e9345;   // grass highlights

    // First paint continuous grass from asphalt bottom down to screen bottom across the whole world.
    // (Grass is ok to draw under pits too — the pit rectangle will paint over it.)
    this.add.rectangle(0, GROUND_Y + ASPHALT_H, this.worldWidth, GAME_H - (GROUND_Y + ASPHALT_H), GRASS_COLOR).setOrigin(0);
    // A lighter strip right at the top of the grass for depth
    this.add.rectangle(0, GROUND_Y + ASPHALT_H, this.worldWidth, 2, GRASS_LIGHT).setOrigin(0);

    // Now paint asphalt and decorations only where there IS ground (skipping pits).
    for (const [a, b] of segs) {
      const w = b - a;
      // Asphalt main surface
      this.add.rectangle(a, GROUND_Y, w, ASPHALT_H, ROAD_COLOR).setOrigin(0);
      // Subtle top edge highlight (curb lip)
      this.add.rectangle(a, GROUND_Y, w, 1, ROAD_EDGE).setOrigin(0);
      // Subtle shadow at the bottom of the asphalt where it meets grass
      this.add.rectangle(a, GROUND_Y + ASPHALT_H - 1, w, 1, 0x1f2126).setOrigin(0);
      // Dashed white center line
      const lineY = GROUND_Y + Math.floor(ASPHALT_H / 2) - 1;
      for (let x = a + 6; x + 24 < b; x += 40) {
        this.add.rectangle(x, lineY, 24, 2, ROAD_LINE).setOrigin(0);
      }
      // Grass tufts along the strip just below the road
      for (let x = a + 4; x < b; x += 14 + (x % 5)) {
        this.add.rectangle(x, GROUND_Y + ASPHALT_H + 2, 2, 3, GRASS_DARK).setOrigin(0);
      }
    }

    // Pits: paint a dark void all the way down, with darker edge strips
    for (const [a, b] of this.pits) {
      this.add.rectangle(a, GROUND_Y, b - a, GAME_H - GROUND_Y, 0x141418).setOrigin(0);
      // broken asphalt edges on each side
      this.add.rectangle(a - 3, GROUND_Y, 3, ASPHALT_H, 0x26282d).setOrigin(0);
      this.add.rectangle(b,     GROUND_Y, 3, ASPHALT_H, 0x26282d).setOrigin(0);
    }

    // Physics colliders for ground segments
    this.groundGroup = this.physics.add.staticGroup();
    for (const [a, b] of segs) {
      const segW = b - a;
      const rect = this.add.rectangle(a + segW / 2, GROUND_Y + 8, segW, 16, 0x000000, 0);
      this.physics.add.existing(rect, true);
      this.groundGroup.add(rect);
    }

    // Auto-place orange traffic cones on each side of every pit as a warning
    for (const [a, b] of this.pits) {
      this.drawCone(a - 14, GROUND_Y);   // left-side warning cone
      this.drawCone(b + 6,  GROUND_Y);   // right-side warning cone
    }

    // ----- Floating platforms (optional per level) -----
    for (const p of (this.platforms_defs || [])) {
      this.drawPlatform(p.x, p.y, p.w);
    }

    // ----- Scenery props -----
    this.drawProps();

    // ----- Collectibles -----
    this.collectibles = this.physics.add.group({ allowGravity: false, immovable: true });
    for (const c of this.collectibles_defs) {
      const hat = this.makeHardHat(c.x, c.y);
      this.collectibles.add(hat);
      this.tweens.add({ targets: hat, y: c.y - 4, yoyo: true, repeat: -1, duration: 900, ease: 'Sine.inOut' });
    }

    // ----- Barrels -----
    this.barrels = this.physics.add.staticGroup();
    for (const b of this.barrels_defs) this.barrels.add(this.makeBarrel(b.x, b.y));

    // ----- Rats (enemies) -----
    this.rats = this.physics.add.group({ allowGravity: true });
    this.ratData = [];
    for (const r of this.rats_defs) {
      const rat = this.makeRat(r.x, r.y);
      this.rats.add(rat);
      this.ratData.push({ sprite: rat, minX: r.x - r.range, maxX: r.x + r.range, dir: 1 });
    }
    this.physics.add.collider(this.rats, this.groundGroup);

    // ----- Goal flag -----
    this.makeGoal(this.goalX, GROUND_Y);

    // ----- Player -----
    this.player = this.physics.add.sprite(120, GROUND_Y - 60, 'builder');
    this.player.setScale(PLAYER_SCALE);
    this.player.body.setSize(20, 30).setOffset(6, 2);
    this.physics.add.collider(this.player, this.groundGroup);
    this.physics.add.collider(this.player, this.barrels);
    this.physics.add.overlap(this.player, this.collectibles, (pl, hat) => this.collectHat(hat), null, this);
    this.physics.add.overlap(this.player, this.rats, (pl, rat) => this.touchRat(rat), null, this);

    // ----- Animations (guarded) -----
    const addAnim = (key, cfg) => { if (!this.anims.exists(key)) this.anims.create({ key, ...cfg }); };
    addAnim('idle',   { frames: this.anims.generateFrameNumbers('builder', { frames: [0, 1] }), frameRate: 3, repeat: -1 });
    addAnim('run',    { frames: this.anims.generateFrameNumbers('builder', { frames: [6,7,8,9,10,11] }), frameRate: 12, repeat: -1 });
    addAnim('jumpUp', { frames: this.anims.generateFrameNumbers('builder', { frames: [12, 13] }), frameRate: 10, repeat: 0 });
    addAnim('fall',   { frames: this.anims.generateFrameNumbers('builder', { frames: [14] }), frameRate: 4 });
    addAnim('hammer', { frames: this.anims.generateFrameNumbers('builder', { frames: [18, 19, 20] }), frameRate: 10, repeat: 0 });
    this.player.play('idle');

    // ----- Camera / world -----
    this.cameras.main.setBounds(0, 0, W, GAME_H);
    this.physics.world.setBounds(0, 0, W, GAME_H + 400);
    this.cameras.main.startFollow(this.player, true, 0.12, 0.12);
    this.cameras.main.setDeadzone(120, 0);

    // ----- Input -----
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys({
      a: Phaser.Input.Keyboard.KeyCodes.A,
      d: Phaser.Input.Keyboard.KeyCodes.D,
      w: Phaser.Input.Keyboard.KeyCodes.W,
      space: Phaser.Input.Keyboard.KeyCodes.SPACE,
      hammer: Phaser.Input.Keyboard.KeyCodes.X,
      restart: Phaser.Input.Keyboard.KeyCodes.R,
    });

    this.isHammering = false;
    this.jumpEdge = false;
    this.hammerEdge = false;
    this.mouseHammerPending = false;
    this.player.on('animationcomplete-hammer', () => { this.isHammering = false; });

    // Left mouse click on the game canvas = hammer swing
    this.input.on('pointerdown', (pointer) => {
      if (pointer.leftButtonDown && pointer.leftButtonDown()) {
        this.mouseHammerPending = true;
      } else if (pointer.button === 0) {
        this.mouseHammerPending = true;
      }
    });

    // ----- HUD -----
    this.hatCount = this.registry.get('hatCount') || 0;
    this.barrelCount = this.registry.get('barrelCount') || 0;
    this.ratCount = this.registry.get('ratCount') || 0;
    this.score = this.registry.get('score') || 0;
    this.lastSafeX = 120;
    this.lastSafeY = GROUND_Y - 60;

    this.scoreText = this.add.text(12, 10, '', {
      fontFamily: 'monospace', fontSize: '15px',
      color: '#ffffff', stroke: '#000', strokeThickness: 3,
    }).setScrollFactor(0).setDepth(1000);
    this.levelText = this.add.text(GAME_W - 12, 10, this.levelLabel || '', {
      fontFamily: 'monospace', fontSize: '15px',
      color: '#ffe27a', stroke: '#000', strokeThickness: 3,
    }).setOrigin(1, 0).setScrollFactor(0).setDepth(1000);
    this.timeText = this.add.text(GAME_W / 2, 10, '', {
      fontFamily: 'monospace', fontSize: '15px',
      color: '#ffffff', stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(1000);
    this.updateHUD();

    this.victoryText = this.add.text(GAME_W/2, GAME_H/2 - 20, '', {
      fontFamily: 'monospace', fontSize: '22px', color: '#ffe27a',
      stroke: '#000', strokeThickness: 5, align: 'center'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(1001);
  }

  update(time, delta) {
    // Rat AI — patrol back and forth
    for (const rd of this.ratData) {
      if (!rd.sprite.active) continue;
      const body = rd.sprite.body;
      if (!body) continue;
      if (rd.sprite.x < rd.minX) rd.dir = 1;
      if (rd.sprite.x > rd.maxX) rd.dir = -1;
      body.setVelocityX(60 * rd.dir);
      rd.sprite.setScale(rd.dir === 1 ? 1 : -1, 1);   // flip visual
    }

    // Parallax skyline
    if (this.skyline) this.skyline.tilePositionX = this.cameras.main.scrollX * 0.25;

    // Tick the running timer on the HUD
    if (!this.goalReached) this.updateHUD();

    // Restart
    if (Phaser.Input.Keyboard.JustDown(this.keys.restart)) {
      // wipe persistent score and go back to title
      this.registry.set('score', 0);
      this.registry.set('hatCount', 0);
      this.registry.set('barrelCount', 0);
      this.registry.set('ratCount', 0);
      this.scene.start('title');
      return;
    }
    if (this.goalReached) { this.player.setVelocityX(0); return; }

    // Combined input (keyboard + touch)
    const cur = this.cursors, k = this.keys;
    const leftDown  = cur.left.isDown || k.a.isDown || TouchState.left;
    const rightDown = cur.right.isDown || k.d.isDown || TouchState.right;

    // edge-detect jump/hammer for touch buttons
    const jumpKey = Phaser.Input.Keyboard.JustDown(cur.up) ||
                    Phaser.Input.Keyboard.JustDown(k.w) ||
                    Phaser.Input.Keyboard.JustDown(k.space);
    let jumpPressed = jumpKey;
    if (TouchState.jump && !this.jumpEdge) { jumpPressed = true; this.jumpEdge = true; }
    if (!TouchState.jump) this.jumpEdge = false;

    const hammerKey = Phaser.Input.Keyboard.JustDown(k.hammer);
    let hammerPressed = hammerKey;
    if (TouchState.hammer && !this.hammerEdge) { hammerPressed = true; this.hammerEdge = true; }
    if (!TouchState.hammer) this.hammerEdge = false;
    // Left mouse click pending from this frame
    if (this.mouseHammerPending) { hammerPressed = true; this.mouseHammerPending = false; }

    const onGround = this.player.body.blocked.down || this.player.body.touching.down;

    // Safe-spot tracking
    if (onGround) {
      const overPit = this.pits.some(([a, b]) => this.player.x > a - 10 && this.player.x < b + 10);
      if (!overPit) { this.lastSafeX = this.player.x; this.lastSafeY = this.player.y; }
    }
    if (this.player.y > GAME_H + 60) { this.respawn(); return; }

    // Hammer
    if (hammerPressed && onGround && !this.isHammering) {
      this.isHammering = true;
      this.player.setVelocityX(0);
      SFX.hammer();
      this.player.play('hammer', true);
      this.tryHammerHit();
      // Safety belt: even if animationcomplete doesn't fire, don't stay stuck forever.
      this.time.delayedCall(400, () => { this.isHammering = false; });
      return;
    }
    if (this.isHammering) { this.player.setVelocityX(0); return; }

    // Move
    if (leftDown)       { this.player.setVelocityX(-MOVE_SPEED); this.player.setFlipX(true); }
    else if (rightDown) { this.player.setVelocityX( MOVE_SPEED); this.player.setFlipX(false); }
    else                { this.player.setVelocityX(0); }

    // Jump
    if (jumpPressed && onGround) {
      this.player.setVelocityY(JUMP_VELOCITY);
      this.player.play('jumpUp', true);
      SFX.jump();
    }

    // Animation choice
    if (!onGround) {
      if (this.player.body.velocity.y > 50 && this.player.anims.currentAnim?.key !== 'fall') {
        this.player.play('fall', true);
      }
    } else {
      const moving = Math.abs(this.player.body.velocity.x) > 5;
      if (moving && this.player.anims.currentAnim?.key !== 'run')  this.player.play('run', true);
      if (!moving && this.player.anims.currentAnim?.key !== 'idle') this.player.play('idle', true);
    }

    if (this.player.x >= this.goalX - 10) this.reachGoal();
  }

  /* ------------- helpers ------------- */
  computeGroundSegments() {
    const sorted = [...this.pits].sort((a, b) => a[0] - b[0]);
    const segs = [];
    let cursor = 0;
    for (const [a, b] of sorted) {
      if (a > cursor) segs.push([cursor, a]);
      cursor = Math.max(cursor, b);
    }
    if (cursor < this.worldWidth) segs.push([cursor, this.worldWidth]);
    return segs;
  }

  tryHammerHit() {
    const reach = 60;
    const facing = this.player.flipX ? -1 : 1;
    const hitX = this.player.x + facing * 40;

    // Check barrels
    for (const b of this.barrels.getChildren()) {
      if (!b.active) continue;
      if (Math.abs(b.x - hitX) < reach && Math.abs(b.y - this.player.y) < 60) {
        this.smashBarrel(b); return;
      }
    }
    // Check rats
    for (const rd of this.ratData) {
      if (!rd.sprite.active) continue;
      if (Math.abs(rd.sprite.x - hitX) < reach && Math.abs(rd.sprite.y - this.player.y) < 50) {
        this.squishRat(rd.sprite); return;
      }
    }
  }

  smashBarrel(barrel) {
    const bx = barrel.x, by = barrel.y;
    if (barrel.body) barrel.body.enable = false;
    barrel.setActive(false);
    this.tweens.add({ targets: barrel, alpha: 0, scale: 1.4, duration: 220, ease: 'Quad.out',
      onComplete: () => barrel.destroy() });
    for (let i = 0; i < 6; i++) {
      const chip = this.add.rectangle(bx, by, 4, 4, 0x963b2a);
      this.tweens.add({ targets: chip, x: bx + (Math.random() - 0.5) * 80, y: by - 20 - Math.random() * 30,
        alpha: 0, duration: 500, onComplete: () => chip.destroy() });
    }
    SFX.smash();
    this.floatText(bx, by - 20, `+${BARREL_POINTS}`);
    this.score += BARREL_POINTS;
    this.barrelCount += 1;
    this.updateHUD();
  }

  squishRat(rat) {
    const rx = rat.x, ry = rat.y;
    if (rat.body) rat.body.enable = false;
    rat.setActive(false);
    this.tweens.add({ targets: rat, scaleY: 0.2, alpha: 0, duration: 300, onComplete: () => rat.destroy() });
    SFX.smash();
    this.floatText(rx, ry - 10, `+${RAT_POINTS}`);
    this.score += RAT_POINTS;
    this.ratCount += 1;
    this.updateHUD();
  }

  touchRat(rat) {
    if (!rat.active) return;
    // Player loses a point chunk and gets knocked back
    if (this.invulnUntil && this.time.now < this.invulnUntil) return;
    this.invulnUntil = this.time.now + 1000;
    const away = this.player.x < rat.x ? -1 : 1;
    this.player.setVelocityX(away * 320);
    this.player.setVelocityY(-240);
    this.cameras.main.flash(180, 255, 60, 60);
    SFX.hurt();
    this.score = Math.max(0, this.score - 15);
    this.floatText(this.player.x, this.player.y - 30, '-15');
    this.updateHUD();
  }

  collectHat(hat) {
    if (!hat.active) return;
    if (hat.body) hat.body.enable = false;
    hat.setActive(false);
    this.tweens.add({ targets: hat, alpha: 0, scale: 1.5, duration: 180, onComplete: () => hat.destroy() });
    SFX.collect();
    this.floatText(hat.x, hat.y - 10, `+${HARD_HAT_POINTS}`);
    this.score += HARD_HAT_POINTS;
    this.hatCount += 1;
    this.updateHUD();
  }

  floatText(x, y, msg) {
    const t = this.add.text(x, y, msg, {
      fontFamily: 'monospace', fontSize: '14px',
      color: '#ffe27a', stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5).setDepth(500);
    this.tweens.add({ targets: t, y: y - 30, alpha: 0, duration: 700, onComplete: () => t.destroy() });
  }

  respawn() {
    this.player.setVelocity(0, 0);
    this.player.setPosition(this.lastSafeX, this.lastSafeY - 40);
    this.cameras.main.flash(200, 255, 80, 80);
    SFX.hurt();
  }

  reachGoal() {
    if (this.goalReached) return;
    this.goalReached = true;
    this.player.setVelocityX(0);
    // Save accumulated score to registry (carries to next level)
    this.registry.set('score', this.score);
    this.registry.set('hatCount', this.hatCount);
    this.registry.set('barrelCount', this.barrelCount);
    this.registry.set('ratCount', this.ratCount);
    SFX.win();
    if (this.nextLevel) {
      this.victoryText.setText(`${this.levelLabel} COMPLETE!\n\nScore: ${this.score}\n\nNext stop...`);
      this.time.delayedCall(1800, () => this.scene.start(this.nextLevel));
    } else {
      this.scene.start('win');
    }
  }

  updateHUD() {
    this.scoreText.setText(
      `Hats: ${this.hatCount}   Barrels: ${this.barrelCount}   Rats: ${this.ratCount}   Score: ${this.score}`
    );
    if (this.timeText) {
      const startMs = this.registry.get('runStartMs') || Date.now();
      this.timeText.setText(`TIME  ${formatTime(Date.now() - startMs)}`);
    }
  }

  /* ------------- visual factories ------------- */
  makeHardHat(x, y) {
    const c = this.add.container(x, y);
    c.add([
      this.add.rectangle(0, 5, 20, 3, 0xe0a920),
      this.add.rectangle(0, 0, 16, 8, 0xffc32b),
      this.add.rectangle(-6, -2, 3, 2, 0xffe27a),
    ]);
    this.physics.add.existing(c);
    c.body.setSize(20, 12);
    c.body.setAllowGravity(false);
    return c;
  }

  makeBarrel(x, y) {
    const c = this.add.container(x, y);
    c.add([
      this.add.rectangle(0, 0, 22, 26, 0x963b2a),
      this.add.rectangle(0, -13, 22, 3, 0x2c1510),
      this.add.rectangle(0, -4, 22, 2, 0x6b1f10),
      this.add.rectangle(0,  6, 22, 2, 0x6b1f10),
      this.add.text(0, 0, '!', { fontFamily: 'monospace', fontSize: '12px', color: '#fff3b0' }).setOrigin(0.5),
    ]);
    this.physics.add.existing(c, true);
    c.body.setSize(22, 26);
    return c;
  }

  makeRat(x, y) {
    // small rodent: body, head, tail, eye
    const c = this.add.container(x, y);
    c.add([
      // body
      this.add.rectangle(0, 0, 22, 10, 0x5c3a1c),
      // head (front-right)
      this.add.rectangle(9, -2, 10, 8, 0x6d4a27),
      // ear
      this.add.rectangle(12, -6, 3, 3, 0x3d2612),
      // eye
      this.add.rectangle(13, -2, 2, 2, 0x000000),
      // tail
      this.add.rectangle(-12, 0, 10, 2, 0x5c3a1c),
      this.add.rectangle(-18, -2, 6, 2, 0x5c3a1c),
      // feet
      this.add.rectangle(-4, 6, 3, 2, 0x3d2612),
      this.add.rectangle(6, 6, 3, 2, 0x3d2612),
    ]);
    this.physics.add.existing(c);
    c.body.setSize(24, 14);
    c.body.setOffset(-12, -4);
    c.body.setBounce(0, 0);
    c.body.setCollideWorldBounds(false);
    return c;
  }

  makeGoal(x, topY) {
    this.add.rectangle(x, topY - 60, 3, 60, 0x555555).setOrigin(0.5, 0);
    const flag = this.add.triangle(x + 2, topY - 55, 0, 0, 22, 8, 0, 16, 0xe23b3b).setOrigin(0, 0.5);
    this.tweens.add({ targets: flag, scaleX: 0.7, yoyo: true, repeat: -1, duration: 600, ease: 'Sine.inOut' });
    this.add.text(x - 26, topY - 90, 'FINISH', {
      fontFamily: 'monospace', fontSize: '12px', color: '#ffffff', stroke: '#000', strokeThickness: 3
    }).setOrigin(0.5);
  }

  // Reusable cone — used by drawProps and by auto-placed warning cones at pit edges
  drawCone(x, topY) {
    // tall orange cone body (triangle), dark base strip, light reflective band
    this.add.triangle(x, topY - 1, 0, 22, 8, 0, 16, 22, 0xe67e22).setOrigin(0);
    this.add.triangle(x + 1, topY - 1, 0, 22, 8, 0, 6, 22, 0xcc6416).setOrigin(0);  // shadow side
    this.add.rectangle(x - 3, topY - 3, 22, 3, 0x34312c).setOrigin(0);
    this.add.rectangle(x, topY - 10, 16, 3, 0xfff1d0).setOrigin(0);
  }

  // Platform — draws visual + adds to groundGroup so it's solid
  drawPlatform(x, y, w) {
    const topCol  = this.platformTopColor  || 0x8a5a2b;  // wood default
    const sideCol = this.platformSideColor || 0x5a3a1b;
    const edge    = this.platformEdgeColor || 0x3a2a14;
    // Top surface (what you stand on)
    this.add.rectangle(x, y, w, 6, topCol).setOrigin(0);
    // Side/underside (thickness)
    this.add.rectangle(x, y + 6, w, 14, sideCol).setOrigin(0);
    // Dark edge shadow for depth
    this.add.rectangle(x, y + 19, w, 1, edge).setOrigin(0);
    // Plank/beam detail lines
    for (let px = x + 14; px < x + w - 4; px += 22) {
      this.add.rectangle(px, y + 1, 1, 18, edge).setOrigin(0);
    }
    // Support chains/ropes hanging below (adds a nice floating look)
    this.add.rectangle(x + 6, y + 20, 1, 14, edge).setOrigin(0);
    this.add.rectangle(x + w - 6, y + 20, 1, 14, edge).setOrigin(0);
    // Physics collider
    const rect = this.add.rectangle(x + w / 2, y + 3, w, 6, 0x000000, 0);
    this.physics.add.existing(rect, true);
    this.groundGroup.add(rect);
  }

  drawProps() {
    // subclasses can override
    for (const p of (this.props_defs || [])) {
      const gt = GROUND_Y;
      if (p.type === 'cone') {
        this.drawCone(p.x, gt);
      } else if (p.type === 'scaffold') {
        const lx = p.x, ly = gt - 120;
        this.add.rectangle(lx, ly, 4, 120, 0x4a4238).setOrigin(0);
        this.add.rectangle(lx + 20, ly, 4, 120, 0x4a4238).setOrigin(0);
        for (let r = 0; r < 6; r++) this.add.rectangle(lx, ly + 20 + r * 18, 24, 3, 0x4a4238).setOrigin(0);
      } else if (p.type === 'plank') {
        this.add.rectangle(p.x, gt - 14, 90, 8, 0x8a5a2b).setOrigin(0);
        this.add.rectangle(p.x, gt - 6, 90, 2, 0x5a3a1b).setOrigin(0);
      }
    }
  }
}

/* =========================================================
 *  WIN SCENE
 * ========================================================= */
class WinScene extends Phaser.Scene {
  constructor() { super('win'); }
  create() {
    const score = this.registry.get('score') || 0;
    const hats = this.registry.get('hatCount') || 0;
    const barrels = this.registry.get('barrelCount') || 0;
    const rats = this.registry.get('ratCount') || 0;
    const startMs = this.registry.get('runStartMs');
    const runMs = startMs ? Date.now() - startMs : 0;

    // Check records BEFORE saving, so we can display "NEW RECORD" tags
    const prevBestScore = Storage.getBestScore();
    const prevBestTime = Storage.getBestTimeMs();
    const newScoreRecord = score > prevBestScore;
    const newTimeRecord = (prevBestTime === null) || (runMs < prevBestTime);

    if (newScoreRecord) Storage.setBestScore(score);
    if (newTimeRecord)  Storage.setBestTimeMs(runMs);

    // Background
    this.add.rectangle(0, 0, GAME_W, GAME_H, 0x1a1d24).setOrigin(0);
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * GAME_W;
      const y = Math.random() * GAME_H;
      const colors = [0xe23b3b, 0xffc32b, 0x6fa3c7, 0x6bc17a, 0xffe27a];
      this.add.rectangle(x, y, 6, 10, colors[i % colors.length]).setAngle(Math.random() * 360);
    }

    this.add.text(GAME_W/2, 60, 'JOB COMPLETE!', {
      fontFamily: 'monospace', fontSize: '38px', color: '#ffe27a',
      stroke: '#2a3142', strokeThickness: 5,
    }).setOrigin(0.5);

    this.add.text(GAME_W/2, 110, 'Street, site, skyward, rooftop — all four jobs done.\nBuilder of the year.', {
      fontFamily: 'monospace', fontSize: '13px', color: '#cdd3dc', align: 'center'
    }).setOrigin(0.5);

    // This run's stats
    this.add.text(GAME_W/2, 190,
      `Hats:    ${hats}\n` +
      `Barrels: ${barrels}\n` +
      `Rats:    ${rats}\n` +
      `SCORE:   ${score}${newScoreRecord ? '    ★ NEW RECORD' : ''}\n` +
      `TIME:    ${formatTime(runMs)}${newTimeRecord ? '   ★ NEW RECORD' : ''}`,
      { fontFamily: 'monospace', fontSize: '18px', color: '#ffffff', align: 'center', lineSpacing: 5 }
    ).setOrigin(0.5);

    // Previous bests (for comparison)
    this.add.text(GAME_W/2, 310,
      `Previous best score:  ${prevBestScore}\n` +
      `Previous best time:   ${formatTime(prevBestTime)}`,
      { fontFamily: 'monospace', fontSize: '12px', color: '#9aa3b2', align: 'center', lineSpacing: 3 }
    ).setOrigin(0.5);

    const btn = this.add.rectangle(GAME_W/2, 370, 200, 46, 0x2a3142).setOrigin(0.5).setStrokeStyle(3, 0xffe27a);
    this.add.text(GAME_W/2, 370, 'BACK TO TITLE', { fontFamily: 'monospace', fontSize: '16px', color: '#ffe27a' }).setOrigin(0.5);
    btn.setInteractive({ useHandCursor: true });

    const goBack = () => {
      SFX.click();
      this.registry.set('score', 0);
      this.registry.set('hatCount', 0);
      this.registry.set('barrelCount', 0);
      this.registry.set('ratCount', 0);
      this.registry.remove('runStartMs');
      this.scene.start('title');
    };
    btn.on('pointerdown', goBack);
    this.input.keyboard.once('keydown', goBack);
  }
}
